name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Linux build and runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake curl libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libgl1-mesa-dev libasound2-dev \
            zlib1g-dev xvfb xauth libgl1-mesa-dri libasound2-plugins pulseaudio pulseaudio-utils

      - name: Install pinned Odin toolchain
        run: ./tools/install_odin.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'odin')

      # The hosted Windows VM has no OpenGL driver or audio playback device.
      # Desktop runtime validation remains required locally before a release.
      - name: Validate Windows export (headless)
        if: runner.os == 'Windows'
        run: ./tools/release_check.ps1

      - name: Validate Linux export and runtime
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          # ALSA's raw null PCM consumes samples without a playback clock.
          # PulseAudio's null sink discards audio at real-time speed.
          pulseaudio --start --exit-idle-time=-1
          audio_module=$(pactl load-module module-null-sink sink_name=rune_ci rate=48000)
          trap 'pactl unload-module "$audio_module"' EXIT
          export PULSE_SINK=rune_ci
          export ALSA_CONFIG_PATH="$GITHUB_WORKSPACE/.github/alsa-null.conf"
          xvfb-run -a -s '-screen 0 1280x720x24' \
            pwsh -NoProfile -File tools/release_check.ps1 -Runtime

      - name: Save validation reports and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validation-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/release check */report.json
            build/release check */*.log
            build/release check */Rune Engine/build/*.runtime.*.log
            build/release check */New Game/build/first-frame.png

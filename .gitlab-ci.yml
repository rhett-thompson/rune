stages:
  - validate

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  ODIN_RELEASE: dev-2026-09

validate:
  stage: validate
  image:
    name: mcr.microsoft.com/powershell:7.5-ubuntu-24.04
    entrypoint: [""]
  before_script:
    - >-
      apt-get update &&
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
      build-essential
      ca-certificates
      clang
      curl
      git
      libasound2-dev
      libgl1-mesa-dev
      libxcursor-dev
      libxi-dev
      libxinerama-dev
      libxrandr-dev &&
      rm -rf /var/lib/apt/lists/*
    - mkdir -p .ci/odin
    - >-
      curl --fail --silent --show-error --location
      "https://api.github.com/repos/odin-lang/Odin/releases/tags/${ODIN_RELEASE}"
      --output .ci/odin-release.json
    - >-
      ODIN_URL="$(sed -n
      's/.*"browser_download_url": "\([^"]*linux-amd64[^"]*\.tar\.gz\)".*/\1/p'
      .ci/odin-release.json | head -n 1)" &&
      test -n "${ODIN_URL}" &&
      curl --fail --silent --show-error --location
      "${ODIN_URL}" --output .ci/odin.tar.gz
    - tar -xzf .ci/odin.tar.gz -C .ci/odin
    - >-
      ODIN_BIN="$(find "${CI_PROJECT_DIR}/.ci/odin" -type f -name odin
      -perm /111 | head -n 1)" &&
      test -n "${ODIN_BIN}" &&
      export PATH="$(dirname "${ODIN_BIN}"):${PATH}" &&
      printf '%s' "$(dirname "${ODIN_BIN}")" > .ci/odin-path
    - export PATH="$(cat .ci/odin-path):${PATH}" && odin version
  script:
    - export PATH="$(cat .ci/odin-path):${PATH}" && pwsh -NoProfile -File tools/validate.ps1 -AllExamples

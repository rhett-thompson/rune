stages:
  - validate

variables:
  GIT_SUBMODULE_STRATEGY: recursive

validate:
  stage: validate
  image:
    name: mcr.microsoft.com/powershell:7.5-ubuntu-24.04
    entrypoint: [""]
  before_script:
    - >-
      apt-get update &&
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
      build-essential
      ca-certificates
      clang
      cmake
      curl
      git
      libasound2-dev
      libgl1-mesa-dev
      libx11-dev
      libxcursor-dev
      libxi-dev
      libxinerama-dev
      libxrandr-dev
      zlib1g-dev &&
      rm -rf /var/lib/apt/lists/*
    - pwsh -NoProfile -File tools/install_odin.ps1 -Destination .ci/odin
    - >-
      ODIN_BIN="$(find "${CI_PROJECT_DIR}/.ci/odin" -type f -name odin
      -perm /111 | head -n 1)" &&
      test -n "${ODIN_BIN}" &&
      export PATH="$(dirname "${ODIN_BIN}"):${PATH}" &&
      printf '%s' "$(dirname "${ODIN_BIN}")" > .ci/odin-path
    - export PATH="$(cat .ci/odin-path):${PATH}" && odin version
  script:
    - export PATH="$(cat .ci/odin-path):${PATH}" && pwsh -NoProfile -File tools/validate.ps1 -AllExamples
